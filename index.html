<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04070d" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>TankCommand</title>
    <style>
      /* Shown from the first painted frame until the game mounts, so launch is never a blank flash. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04070d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse 60% 50% at 50% 50%, #0d1626 0%, #04070d 70%);
      }
      #boot svg {
        width: 84px;
        height: 84px;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #app:not(:empty) ~ #boot {
        display: none;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <path d="M32 3 L57 15 V39 L32 61 L7 39 V15 Z" fill="#060b14" stroke="#c6d1de" stroke-width="2.4" />
        <path d="M32 9 V55" stroke="#c6d1de" stroke-width="1.2" opacity="0.55" />
        <g fill="#3fd8ff">
          <path d="M13 29 L28 15 V24 L13 38 Z" />
          <path d="M13 43 L28 29 V38 L18.5 46.9 Z" />
          <path d="M22 50 L28 44.4 V55.3 Z" />
        </g>
        <g fill="#ffc66b">
          <path d="M36 15 C50 19 53 36 36 54 C45 40 45 28 36 15 Z" />
          <circle cx="39.5" cy="33" r="3.1" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
